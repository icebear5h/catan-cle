# LEGACY: historical decision half of the legacy pair (with communication_v5.yaml). New games use shared_v1.yaml.
id: catan-agent
version: 11.0.0
status: legacy

system:
  template: |-
    You are playing a game of Catan. You are playing as {{ color }}.

context:
  mode: components
  initial_placement_order: both_rounds
  social_context: true
  order:
    - trajectory
    - strategic_memory
    - visible_events
    - recent_table_talk
    - commitments
    - phase_info
    - board_state
    - resources
    - opponents
    - trade_window
    - phase_guidance
    - legal_actions
    - decision_request
    - response_schema
  trajectory:
    mode: full
    max_messages: null

sections:
  strategic_memory:
    template: |-
      YOUR CURRENT GAME PLAN:
      {{ value }}
    empty: include
    empty_text: No plan has been recorded yet.
  visible_events:
    template: |-
      COMPLETE VISIBLE GAME EVENT HISTORY:
      {{ value }}
    empty: include
    empty_text: No visible game events have occurred yet.
  recent_table_talk:
    template: |-
      RECENT VISIBLE TABLE TALK:
      {{ value }}
    empty: include
    empty_text: No recent visible table talk.
  commitments:
    template: |-
      ACTIVE NON-BINDING COMMITMENTS:
      {{ value }}
    empty: include
    empty_text: No active visible commitments.
  phase_info:
    template: |-
      CURRENT PHASE:
      {{ value }}
    empty: include
    empty_text: No phase information is available.
  board_state:
    template: |-
      BOARD STATE:
      {{ value }}
    empty: include
    empty_text: No board state is available.
  resources:
    template: |-
      {{ value }}
    empty: include
    empty_text: No resource information is available.
  opponents:
    template: |-
      VISIBLE OPPONENT STATE:
      {{ value }}
    empty: include
    empty_text: No opponent information is available.
  trade_window:
    template: |-
      ACTIVE TRADE WINDOW:
      {{ value }}
    empty: include
    empty_text: No trade window is active.
  phase_guidance:
    template: |-
      DECISION FACTS:
      {{ value }}
    empty: include
    empty_text: No phase-specific facts are available.
  legal_actions:
    template: |-
      AVAILABLE ACTION TOOLS:
      {{ value }}
    empty: include
    empty_text: No legal actions are available.
  decision_request:
    template: |-
      DECISION REQUEST:
      {{ value }}
    empty: include
    empty_text: Select one legal action.
  response_schema:
    template: |-
      RESPONSE SCHEMA:
      {{ value }}
    empty: include
    empty_text: Return a valid response.

phase_guidance:
  initial_settlement_1: |-
    STRATEGIC OBJECTIVE FOR THIS PROBE:
    - Maximizing raw pip count is not the objective. Resource diversity is not the objective either. Use production and coverage only when they support a coherent opening plan.
    - Evaluate the first and plausible second settlements as one coupled portfolio. You place the second settlement after every opponent has placed once, so identify multiple complementary backups rather than assuming one node will remain available.
    - Choose and justify a board-specific opening archetype. Examples include an expansion engine built around WOOD, BRICK, and WHEAT; a development-card/city engine built around ORE, WHEAT, and SHEEP; or a credible scarcity/port conversion plan. Do not force all five resources when a focused engine has better conversion ratios.
    - Account for the starting cards from the second settlement, realistic port timing, resource scarcity, number correlation, robber exposure, opponent contention, road direction, and at least two reachable expansion targets.
    - Tie the selected first settlement to a concrete early-game sequence and state what the second settlement must complement. Prefer a slightly lower-pip coherent engine over a higher-pip collection that lacks synergy or a credible route to builds.
    - This placement gives no starting cards. Your opening hand comes only from your second settlement: one card from each adjacent non-desert tile, placed independently of this road.
  initial_settlement_2: |-
    - Reassess the board as it now stands rather than committing to the original plan.
    - Complement your first settlement's production, cover missing resources and dice numbers, and preserve room to expand.
    - This settlement gives one starting card from each adjacent non-desert tile. Consider what those cards enable early without sacrificing long-term production.
    - Value a port only when your combined production can support it.
  initial_road_1: |-
    - Aim toward more than one viable expansion location and avoid unnecessary dead ends.
    - Compare access to missing resources, useful ports, open branches, and contested space.
    - This road begins expansion from your first settlement. Your second settlement remains an independent choice and does not need to connect to this road.
  initial_road_2: |-
    - Direct this road toward open settlement locations that complement your production.
    - Preserve multiple branches where possible, and compare access to missing resources, useful ports, and contested space.
    - Consider how this road could eventually join your two starting networks, but do not sacrifice a stronger expansion route solely to connect them.
  initial_placement: |-
    Build a coherent two-settlement opening: reliable production, broad resource and number coverage, and room to expand. The first settlement gives no starting cards; the independently placed second settlement gives one card from each adjacent non-desert tile. Point each road toward useful future settlement locations.
  discarding: |-
    Resolve the required discard. Choose exactly the stated number of cards from your holdings using named resource counts. Reassess your plan after the robber sequence changes production or resources.
    Resource maps use WOOD, BRICK, SHEEP, WHEAT, and ORE with positive integer counts and no duplicate keys, including different casing. Example: {"tool":"discard","arguments":{"cards":{"WOOD":2,"SHEEP":2}}}
  robber: |-
    - Balance blocking valuable opponent production against blocking your own tiles and inviting retaliation.
    - Use visible production, public VP, and opponent hand sizes to judge the strongest target without assuming hidden cards.
    - Robber movement and victim selection may be separate choices. If victim selection follows, the victim is chosen but the stolen card is random.
    - play_knight includes the robber destination: the sandbox plays the card and moves the robber from this one decision. If the Knight wins immediately through Largest Army, the game ends before movement. Any victim selection follows separately; the stolen resource is random and cannot be specified. move_robber handles a pending move after a seven or a historical unbundled Knight. Examples: {"tool":"play_knight","arguments":{"tile":"<T05>"}} {"tool":"move_robber","arguments":{"tile":"<T05>"}} {"tool":"steal_from","arguments":{"player":"BLUE"}}
  main_game: |-
    - Check first for an action that wins immediately or prevents a visible immediate threat.
    - Choose the next action as part of a sequence: trade or convert resources before spending them, then build, buy, or end the turn as the position requires.
    - Compare progress through production, settlement access, cities, development cards, Largest Army, Longest Road, and ports rather than counting only immediate VP.
    - Treat opponent resource types and unplayed development cards as unknown.
    - Trade acceptance is non-binding until the turn player confirms a candidate; the turn player may instead continue or end the turn.
    - Resource maps use WOOD, BRICK, SHEEP, WHEAT, and ORE with positive integer counts and no duplicate keys, including different casing. Year of Plenty takes two bank cards, or a singleton only when the engine permits it. Maritime trades give one resource type at the current best 4:1, 3:1, or 2:1 rate for exactly one different bank card. Example: {"tool":"play_year_of_plenty","arguments":{"take":{"WOOD":1,"ORE":1}}} {"tool":"play_monopoly","arguments":{"resource":"WHEAT"}} {"tool":"maritime_trade","arguments":{"give":{"WOOD":4},"receive":{"ORE":1}}}
    - Offer IDs are opaque: copy them exactly. offer_trade and counter_offer also accept optional non-negative give_any and receive_any counts; wildcards are proposals, not executable exchanges. Counteroffers address root offers and only the turn player. Acceptance signals willingness, never transfers cards; the turn player chooses the final offer and counterparty with confirm_trade. cancel_trade withdraws only the named offer. Never offer cards you do not hold. Examples: {"tool":"offer_trade","arguments":{"give":{"WOOD":1},"receive":{"ORE":1}}} {"tool":"confirm_trade","arguments":{"offer_id":"exact visible ID","counterparty":"BLUE"}}
    - Parameterless tools use an empty arguments object, for example {"tool":"end_turn","arguments":{}}. Other parameterless tools are roll_dice, buy_development_card, and play_road_building; follow the current availability list. Road Building's road placements remain subsequent build_road decisions.

response:
  format: json
  tags:
    - game_plan
    - tool
    - arguments
  fallback: first_legal
  instruction: |-
    Return exactly one JSON object with tool and arguments, and optionally game_plan containing brief information useful for later decisions. No XML, markdown fences, extra fields, repeated keys, action indices, or batches of calls.
    Spatial arguments are literal trained board tokens: <N00> through <N53>, canonical endpoint edge tokens such as <E00_01>, and <T00> through <T18>. These strings are data, not XML tags. Do not remove or escape their angle brackets, use raw integer IDs, or invent sequential edge tokens.
    Choose only a currently available tool and its exact named arguments. Examples illustrate syntax, not current legality: {"game_plan":"Expand toward the port.","tool":"build_road","arguments":{"edge":"<E00_01>"}} {"tool":"build_settlement","arguments":{"node":"<N00>"}}
    Invalid calls change no gameplay state and receive corrective feedback within the bounded retry policy; exhausting the attempt limit leaves the decision unapplied.
