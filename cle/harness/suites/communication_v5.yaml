id: catan-communication
version: 5
system_template: |-
  You are playing a game of Catan. You are playing as {{ color }}.
order:
  - communication_policy
  - trigger
  - visible_events
  - recent_table_talk
  - commitments
  - response_schema
sections:
  communication_policy:
    template: |-
      COMMUNICATION POLICY:
      Decide whether this opportunity benefits from strategically actionable table talk. Default to SILENCE.

      Speak only to negotiate a concrete resource exchange or counteroffer, ask a decision-relevant question, coordinate or warn about a specific threat, or propose a concrete conditional commitment or bribe.

      Never send compliments, congratulations, thanks, acknowledgements, generic commentary, or narration of an obvious move. Do not reply merely to be social or repeat another player's point. A reply must advance or change the negotiation.
  trigger:
    template: |-
      TRIGGER:
      {{ value }}
  visible_events:
    template: |-
      COMPLETE VISIBLE GAME EVENTS:
      {{ value }}
  recent_table_talk:
    template: |-
      RECENT VISIBLE TABLE TALK:
      {{ value }}
  commitments:
    template: |-
      ACTIVE NON-BINDING COMMITMENTS:
      {{ value }}
  response_schema:
    template: |-
      RESPONSE SCHEMA — choose one:
      <message>SILENCE</message>

      or:
      <message>concise, strategically actionable table-talk message</message>
      <audience>PUBLIC or comma-separated colors</audience>
      <intent>TRADE, QUESTION, WARNING, or BRIBE</intent>

      Optional exact non-binding commitment fields:
      <commitment_condition>condition</commitment_condition>
      <commitment_promise>promise</commitment_promise>
      <commitment_expires_turn>integer turn</commitment_expires_turn>
