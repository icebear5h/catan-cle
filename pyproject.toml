[project]
name = "catan-learning-environment"
version = "0.1.0"
description = "Multi-player RL environment for Catan with continuous learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.37.1",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "networkx>=3.6.1",
    "requests>=2.31.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "flask-socketio>=5.6.0",
    "anthropic>=0.40.0",
    "Pillow>=10.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
modal = ["modal>=0.68.0"]
eval = [
    "openbench==0.5.2",
    "inspect-ai==0.3.125",
    "inspect-viz==0.4.1",
    "openai>=1.0.0",
    "jupyter>=1.0.0",
    "plotly>=5.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
training = ["torch>=2.0.0", "catanatron>=1.0.0"]
scraping = ["httpx>=0.25.0", "playwright>=1.40.0", "google-api-python-client>=2.100.0", "youtube-transcript-api>=0.6.0"]
pretraining = [
    "torch>=2.0.0",
    "transformers>=4.57.1",
    "peft>=0.7.0",
    "llamafactory>=0.9.0",
    "wandb>=0.16.0",
    "bitsandbytes>=0.41.0",
    "google-api-python-client>=2.100.0",
    "youtube-transcript-api>=0.6.0",
]
sft = [
    "torch>=2.6.0",
    "transformers==5.16.1",
    "trl==1.12.0",
    "peft>=0.20.0",
    "accelerate>=1.10.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.46.0",
    "qwen-vl-utils>=0.0.14",
    "tensorboard>=2.14.0",
    "wandb>=0.16.0",
]
dev = [
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "ruff>=0.14.8",
    "mypy>=2.3.1",
    "types-networkx>=3.6.1.20260911",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
    "pandas-stubs>=3.0.5.260914",
    "types-flask-cors>=6.0.3.20260712",
    "types-flask-socketio>=5.6.0.20260728",
    "google-api-python-client-stubs>=1.40.0",
    "fastapi>=0.136.1",
]

[project.scripts]
cle = "cle.run:main"

[project.entry-points."openbench.benchmarks"]
catan_board_bench = "evals.catan_board_bench.metadata:get_benchmark_metadata"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cle", "data_pipeline", "evals", "sft"]
exclude = ["evals/catan_board_bench_ui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Frozen scorer: strict_scorer_sha256 hashes inspect.getsource of these helpers,
# so annotating them would change the published fingerprint. Exempt only ANN401.
"evals/catan_board_bench/ascii_variations/scoring.py" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
disallow_any_explicit = true
show_error_codes = true
# pydantic synthesizes `__init__(**data: Any)`; the plugin with init_typed makes it concrete.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true

# Tests are not type-checked (user decision 2026-09-23): they index JSON payloads
# from strictly typed source, so every source type change would re-break them for
# no runtime signal. Ruff (annotations, imports) still applies to tests; source
# stays fully strict.
[[tool.mypy.overrides]]
module = ["tests.*", "playground.frontend.tests.*"]
ignore_errors = true

# Frozen scorer (see the Ruff per-file-ignores note): its hashed helpers take
# Any by design; exempt only the two Any rules for this one module.
[[tool.mypy.overrides]]
module = "evals.catan_board_bench.ascii_variations.scoring"
disable_error_code = ["explicit-any", "no-any-return"]

# Legacy SFT trainers subclass third-party bases that are Any locally: ms-swift
# is an uninstalled optional extra, and trl's SFTTrainer is typed against the
# Modal image pins (trl 1.12 / transformers 5.16), not the local venv.
[[tool.mypy.overrides]]
module = "sft.ms_swift_plugin"
disallow_subclassing_any = false
# @dataclass on the Any-typed SftArguments base synthesizes an Any __init__.
disable_error_code = ["explicit-any"]

# The trainer resolves trl.SFTTrainer at call time so importing the package stays
# light; mypy cannot use that runtime value as a base class.
[[tool.mypy.overrides]]
module = "sft.scripts.train.train_trl_catan_vision._trainer"
disallow_subclassing_any = false
disable_error_code = ["valid-type", "misc"]

[[tool.mypy.overrides]]
module = ["accelerate", "accelerate.*"]
ignore_missing_imports = true

# Modal synthesizes the constructor for `modal.parameter` fields at runtime, so
# mypy cannot see `VLMBenchmark(model_id=...)`; exempt only call-arg here.
[[tool.mypy.overrides]]
module = "scripts.probes.vlm_benchmark_modal"
disable_error_code = ["call-arg"]

# ms-swift is an optional extra that is not installed locally, and tokenizers
# ships no stubs or py.typed marker (no stub package exists).
[[tool.mypy.overrides]]
module = ["swift", "swift.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[tool.uv]
# llamafactory (pretraining) caps peft at 0.18 while the SFT trainer needs peft 0.20 (the Modal image pin).
conflicts = [[{ extra = "sft" }, { extra = "pretraining" }]]
