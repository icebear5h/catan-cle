[project]
name = "catan-learning-environment"
version = "0.1.0"
description = "Multi-player RL environment for Catan with continuous learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.37.1",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "networkx>=3.6.1",
    "requests>=2.31.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "flask-socketio>=5.6.0",
    "anthropic>=0.40.0",
    "Pillow>=10.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
modal = ["modal>=0.68.0"]
eval = [
    "openbench>=0.5.0",
    "inspect-ai>=0.3.0",
    "openai>=1.0.0",
    "jupyter>=1.0.0",
    "plotly>=5.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
training = ["torch>=2.0.0", "catanatron>=1.0.0"]
scraping = ["httpx>=0.25.0", "playwright>=1.40.0", "google-api-python-client>=2.100.0", "youtube-transcript-api>=0.6.0"]
pretraining = [
    "torch>=2.0.0",
    "transformers>=4.57.1",
    "peft>=0.7.0",
    "llamafactory>=0.9.0",
    "wandb>=0.16.0",
    "bitsandbytes>=0.41.0",
    "google-api-python-client>=2.100.0",
    "youtube-transcript-api>=0.6.0",
]
sft = [
    "torch>=2.6.0",
    "transformers>=4.57.1",
    "trl>=0.21.0",
    "peft>=0.17.0",
    "accelerate>=1.10.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.46.0",
    "qwen-vl-utils>=0.0.14",
    "tensorboard>=2.14.0",
    "wandb>=0.16.0",
]
dev = ["pytest-cov>=4.1.0", "black>=23.3.0", "ruff>=0.0.270"]

[project.scripts]
cle = "cle.run:main"

[project.entry-points."openbench.benchmarks"]
catan_board_bench = "catan_board_bench.eval.metadata:get_benchmark_metadata"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cle", "game_engine", "data_pipeline", "evals", "catan_board_bench", "sft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
