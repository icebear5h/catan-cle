model:
  model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
  torch_dtype: bfloat16
  attn_implementation: eager
  load_in_4bit: false

tokens:
  add_catan_tokens: true
  token_manifest: configs/training_configs/catan_added_tokens.json
  resize_embeddings: true

trainable_scope:
  freeze_base_model: true
  train_added_token_embeddings: true
  train_lm_head: true

lora:
  enabled: false

training:
  output_dir: sft/outputs/qwen3-vl-8b-catan-atlas-emb-head
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  gradient_checkpointing: false
  learning_rate: 0.001
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 5
  save_steps: 100
  save_total_limit: 2
  bf16: true
  report_to:
    - tensorboard
  remove_unused_columns: false
  max_length: null

data:
  prompt_prefix: >-
    Answer exactly using Catan atlas tokens. Do not explain.
